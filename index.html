<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">My tasks</h1>
      <p class="app__count" id="task-count">0 tasks left</p>
    </header>

    <form class="task-form" id="task-form" novalidate>
      <label class="task-form__label" for="taskInput">What needs doing?</label>
      <div class="task-form__row">
        <input
          class="task-form__input"
          id="taskInput"
          name="task"
          type="text"
          maxlength="200"
          autocomplete="off"
          placeholder="e.g. Buy milk"
        >
        <button class="task-form__button" type="submit">Add Task</button>
      </div>
      <p class="task-form__message" id="form-message" role="status" aria-live="polite"></p>
    </form>

    <ul class="task-list" id="taskList"></ul>
    <p class="empty-state" id="empty-state">No tasks yet. Add your first one above.</p>

    <footer class="app__footer">
      <p>Tasks are saved in this browser, so they stay after a refresh.</p>
    </footer>
  </main>

  <script src="todoStore.js"></script>
  <script src="app.js"></script>
</body>
</html>
